<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 6s infinite;
        }

        .particle:nth-child(odd) { background: #ff6b00; }
        .particle:nth-child(even) { background: #ff8c00; }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 5s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 1s; animation-duration: 7s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 2s; animation-duration: 6s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 0.5s; animation-duration: 8s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 3s; animation-duration: 5.5s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 1.5s; animation-duration: 6.5s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 2.5s; animation-duration: 7.5s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 0.8s; animation-duration: 5.8s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 3.5s; animation-duration: 6.2s; }
        .particle:nth-child(10) { left: 15%; animation-delay: 1.2s; animation-duration: 7.2s; }
        .particle:nth-child(11) { left: 25%; animation-delay: 2.8s; animation-duration: 5.3s; }
        .particle:nth-child(12) { left: 45%; animation-delay: 0.3s; animation-duration: 6.8s; }
        .particle:nth-child(13) { left: 55%; animation-delay: 1.8s; animation-duration: 7.8s; }
        .particle:nth-child(14) { left: 65%; animation-delay: 3.2s; animation-duration: 5.6s; }
        .particle:nth-child(15) { left: 85%; animation-delay: 2.2s; animation-duration: 6.4s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Spinning Rings */
        .ring-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .ring {
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .ring:nth-child(1) {
            width: 500px;
            height: 500px;
            border: 1px solid rgba(255, 107, 0, 0.06);
            animation: spinRing 20s linear infinite;
        }

        .ring:nth-child(1)::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #ff6b00;
            border-radius: 50%;
            box-shadow: 0 0 12px #ff6b00;
        }

        .ring:nth-child(2) {
            width: 620px;
            height: 620px;
            border: 1px solid rgba(255, 140, 0, 0.04);
            animation: spinRing 28s linear infinite reverse;
        }

        .ring:nth-child(2)::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            width: 5px;
            height: 5px;
            background: #ff8c00;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff8c00;
        }

        .ring:nth-child(3) {
            width: 740px;
            height: 740px;
            border: 1px solid rgba(255, 170, 0, 0.03);
            animation: spinRing 35s linear infinite;
        }

        .ring:nth-child(3)::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #ffaa00;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffaa00;
        }

        @keyframes spinRing {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Corner Decorations */
        .corner {
            position: fixed;
            width: 60px;
            height: 60px;
            z-index: 0;
        }

        .corner-tl { top: 15px; left: 15px; border-top: 2px solid rgba(255, 107, 0, 0.2); border-left: 2px solid rgba(255, 107, 0, 0.2); }
        .corner-tr { top: 15px; right: 15px; border-top: 2px solid rgba(255, 107, 0, 0.2); border-right: 2px solid rgba(255, 107, 0, 0.2); }
        .corner-bl { bottom: 15px; left: 15px; border-bottom: 2px solid rgba(255, 107, 0, 0.2); border-left: 2px solid rgba(255, 107, 0, 0.2); }
        .corner-br { bottom: 15px; right: 15px; border-bottom: 2px solid rgba(255, 107, 0, 0.2); border-right: 2px solid rgba(255, 107, 0, 0.2); }

        /* Main Container */
        .container {
            text-align: center;
            z-index: 1;
            position: relative;
            padding: 20px;
        }

        /* Gears */
        .gears {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .gear-icon { display: inline-block; }

        .gear:nth-child(1) .gear-icon {
            animation: rotateGear 4s linear infinite;
            font-size: 50px;
            color: #ff8c00;
            filter: drop-shadow(0 0 12px rgba(255, 140, 0, 0.6));
        }

        .gear:nth-child(2) .gear-icon {
            animation: rotateGearReverse 4s linear infinite;
            font-size: 80px;
            margin-left: -10px;
            margin-right: -10px;
            color: #ff6b00;
            filter: drop-shadow(0 0 15px rgba(255, 107, 0, 0.7));
        }

        .gear:nth-child(3) .gear-icon {
            animation: rotateGear 4s linear infinite;
            font-size: 45px;
            color: #ffaa00;
            filter: drop-shadow(0 0 12px rgba(255, 170, 0, 0.6));
        }

        @keyframes rotateGear {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateGearReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Title */
        .title {
            font-size: 46px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 5px;
            animation: glowTextOrange 2s ease-in-out infinite alternate;
        }

        @keyframes glowTextOrange {
            from {
                text-shadow: 0 0 10px rgba(255, 107, 0, 0.3),
                             0 0 20px rgba(255, 107, 0, 0.2);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 107, 0, 0.7),
                             0 0 40px rgba(255, 140, 0, 0.5),
                             0 0 60px rgba(255, 170, 0, 0.3),
                             0 0 80px rgba(255, 107, 0, 0.15);
            }
        }

        .subtitle {
            font-size: 16px;
            color: #ff8c00;
            margin-bottom: 8px;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease-out 0.3s both, pulseOrange 3s ease-in-out infinite;
            text-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        @keyframes pulseOrange {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .tagline {
            font-size: 14px;
            color: #777;
            margin-bottom: 25px;
            letter-spacing: 3px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Progress Bar */
        .progress-container {
            width: 400px;
            max-width: 90vw;
            margin: 0 auto 25px;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-label span:last-child {
            color: #ff8c00;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #1a1a1a;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(255, 107, 0, 0.1);
        }

        .progress-fill {
            height: 100%;
            width: 65%;
            background: linear-gradient(90deg, #ff6b00, #ff8c00, #ffaa00, #ff6b00);
            background-size: 200% 100%;
            border-radius: 3px;
            animation: shimmer 2s linear infinite, progressGrow 2s ease-out both;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.6);
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes progressGrow {
            from { width: 0%; }
            to { width: 65%; }
        }

        /* Bouncing Dots */
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease-out 1s both;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; background: #ff6b00; box-shadow: 0 0 8px rgba(255, 107, 0, 0.6); }
        .dot:nth-child(2) { animation-delay: -0.16s; background: #ff8c00; box-shadow: 0 0 8px rgba(255, 140, 0, 0.6); }
        .dot:nth-child(3) { animation-delay: 0s; background: #ffaa00; box-shadow: 0 0 8px rgba(255, 170, 0, 0.6); }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.2); opacity: 1; }
        }

        /* Warning Stripes */
        .warning-stripes {
            width: 250px;
            max-width: 80vw;
            height: 6px;
            margin: 0 auto 20px;
            background: repeating-linear-gradient(45deg, #ff6b00, #ff6b00 10px, #1a1a1a 10px, #1a1a1a 20px);
            border-radius: 4px;
            opacity: 0.4;
            animation: fadeInUp 1s ease-out 1.2s both;
        }

        /* Description */
        .description {
            color: #888;
            font-size: 15px;
            line-height: 1.7;
            max-width: 480px;
            margin: 0 auto 30px;
            animation: fadeInUp 1s ease-out 1.4s both;
        }

        .description strong { color: #ff8c00; }

        /* ========== BACK TO HOME BUTTON ========== */
        .btn-container {
            animation: fadeInUp 1s ease-out 1.6s both;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 16px 45px;
            border: 2px solid #ff6b00;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.15), rgba(255, 140, 0, 0.08));
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.2);
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 0, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-home:hover::before {
            left: 100%;
        }

        .btn-home:hover {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.35), rgba(255, 140, 0, 0.2));
            border-color: #ffaa00;
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.4),
                        0 0 60px rgba(255, 107, 0, 0.15),
                        inset 0 0 20px rgba(255, 107, 0, 0.1);
            transform: translateY(-3px);
            color: #ffcc00;
        }

        .btn-home:active {
            transform: translateY(-1px);
        }

        .btn-home .arrow {
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        .btn-home:hover .arrow {
            transform: translateX(-6px);
        }

        .btn-home .home-icon {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .btn-home:hover .home-icon {
            transform: scale(1.2);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title { font-size: 26px; letter-spacing: 3px; }
            .subtitle { font-size: 11px; letter-spacing: 4px; }
            .tagline { font-size: 12px; }
            .gear:nth-child(1) .gear-icon { font-size: 35px; }
            .gear:nth-child(2) .gear-icon { font-size: 55px; margin-left: -8px; margin-right: -8px; }
            .gear:nth-child(3) .gear-icon { font-size: 30px; }
            .description { font-size: 13px; padding: 0 15px; }
            .btn-home { font-size: 12px; padding: 13px 30px; }
            .corner { width: 35px; height: 35px; }
        }
    </style>
</head>
<body>

    <!-- Corner Decorations -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Background Rings -->
    <div class="ring-container">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main Content -->
    <div class="container">

        <!-- Rotating Gears -->
        <div class="gears">
            <div class="gear"><span class="gear-icon">&#9881;</span></div>
            <div class="gear"><span class="gear-icon">&#9881;</span></div>
            <div class="gear"><span class="gear-icon">&#9881;</span></div>
        </div>

        <h1 class="title">Under Development</h1>
        <p class="subtitle">&#9888; Website Under Construction &#9888;</p>
        <p class="tagline">We're Building Something Amazing</p>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-label">
                <span>Development Progress</span>
                <span>65%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- Loading Dots -->
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Warning Stripes -->
        <div class="warning-stripes"></div>

        <p class="description">
            Our website is currently <strong>under development</strong>. Our team is working
            hard to bring you an incredible experience. Please check back soon! 🚀
        </p>

        <!-- ★ BACK TO HOME BUTTON ★ -->
        <div class="btn-container">
            <a href="/" class="btn-home">
                <span class="arrow">&#8592;</span>
                <span>Back to Home</span>
                <span class="home-icon">🏠</span>
            </a>
        </div>

    </div>

</body>
</html>
