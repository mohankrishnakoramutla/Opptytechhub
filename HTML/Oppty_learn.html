<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Development</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            color: #fff;
            padding: 20px;
        }

        /* Glowing orbs background */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: orbMove 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(108, 99, 255, 0.3);
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: rgba(255, 99, 182, 0.2);
            bottom: -100px;
            left: -100px;
            animation-delay: -4s;
        }

        @keyframes orbMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -30px) scale(1.1); }
        }

        /* Main container */
        .container {
            text-align: center;
            z-index: 1;
            max-width: 600px;
            position: relative;
        }

        /* Animated Gears */
        .icon-wrapper {
            margin-bottom: 30px;
            display: inline-block;
        }

        .gear {
            display: inline-block;
            animation: spin 4s linear infinite;
        }

        .gear svg {
            width: 90px;
            height: 90px;
            fill: #6c63ff;
            filter: drop-shadow(0 0 20px rgba(108, 99, 255, 0.5));
        }

        .gear:nth-child(2) {
            position: relative;
            top: -10px;
            left: -15px;
            animation: spinReverse 3s linear infinite;
        }

        .gear:nth-child(2) svg {
            width: 60px;
            height: 60px;
            fill: #ff63b6;
            filter: drop-shadow(0 0 20px rgba(255, 99, 182, 0.5));
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Title */
        .title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff, #a78bfa, #ff63b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
            line-height: 1.6;
            animation: fadeInUp 1s ease 0.2s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Back to Home Button */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #6c63ff, #ff63b6);
            border: none;
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
            animation: fadeInUp 1s ease 0.4s forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
            overflow: hidden;
        }

        .back-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.5s ease;
        }

        .back-home:hover::before {
            left: 100%;
        }

        .back-home:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(108, 99, 255, 0.6);
        }

        .back-home:active {
            transform: translateY(0) scale(1);
        }

        .back-home svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }

        .back-home:hover svg {
            transform: translateX(-5px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .gear svg {
                width: 70px;
                height: 70px;
            }

            .gear:nth-child(2) svg {
                width: 45px;
                height: 45px;
            }

            .back-home {
                padding: 16px 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Main Content -->
    <div class="container">

        <!-- Animated Gears -->
        <div class="icon-wrapper">
            <span class="gear">
                <svg viewBox="0 0 24 24">
                    <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
                </svg>
            </span>
            <span class="gear">
                <svg viewBox="0 0 24 24">
                    <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
                </svg>
            </span>
        </div>

        <!-- Title -->
        <h1 class="title">Website Under Development</h1>
        <p class="subtitle">We're working hard to bring you something amazing. Please check back soon!</p>

        <!-- Back to Home Button -->
        <a href="/" class="back-home" id="backHome">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Home
        </a>

    </div>

    <script>
        // Back to Home button click animation
        document.getElementById('backHome').addEventListener('click', function(e) {
            e.preventDefault();

            // Add click animation
            this.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                this.style.transform = '';
                // Navigate to home page - change URL as needed
                window.location.href = '/';
            }, 200);
        });
    </script>
</body>
</html>
